[project]
name = "bycanvas"
version = "0.3.0"
description = "ByCanvas —— 聊天与生图/改图的透传代理后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx[socks]>=0.27",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
